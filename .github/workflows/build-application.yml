name: Build Application And Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build exe with launcher
    runs-on: windows-latest

    env:
      PYTHONIOENCODING: 'UTF-8'
      PYTHONLEGACYWINDOWSSTDIO: 'utf-8'

    strategy:
      matrix:
        python-version: [ '3.12' ]

    steps:
      - name: Configure git
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "Sanheiii@users.noreply.github.com"
          git config --global user.name "Sanheiii"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: true
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Inline ok requirements
        shell: pwsh
        run: |
          python -m ok.update.inline_ok_requirements --tag ${{ github.ref_name }}

      - name: Check release version
        id: release-version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $isRelease = $tag -match '^v?\d+\.\d+\.\d+$'
          "is_release=$($isRelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Release version: $isRelease"

      - name: Build with PyAppify Action
        id: build-app
        uses: ok-oldking/pyappify-action@master
        with:
          version: 'v1.1.3'

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: pyappify_dist/*

      - name: Create Release And Upload Asset
        uses: softprops/action-gh-release@v2
        if: steps.release-version.outputs.is_release == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: pyappify_dist/*
          draft: false
          prerelease: false
          generate_release_notes: true