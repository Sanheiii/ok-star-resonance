name: Manual Build Old Version

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA / branch / tag to build, e.g. abc1234 or v0.2.28'
        required: true
        type: string
      release_tag:
        description: 'Release tag to create/upload, e.g. v0.2.28-rebuild'
        required: true
        type: string
      use_release:
        description: 'Base release API URL used by pyappify-action'
        required: false
        type: string
      upload_release:
        description: 'Upload build result to GitHub Release'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build old version manually
    runs-on: windows-2022

    env:
      PYTHONIOENCODING: 'UTF-8'
      PYTHONLEGACYWINDOWSSTDIO: 'utf-8'
      CI: 'false'

    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - name: Resolve build metadata
        id: meta
        shell: pwsh
        run: |
          $ref = "${{ inputs.ref }}"
          $tag = "${{ inputs.release_tag }}"

          if ([string]::IsNullOrWhiteSpace($ref)) {
            throw "Input 'ref' is required."
          }

          if ($tag -notmatch '^v?\d+\.\d+\.\d+(-[A-Za-z0-9._-]+)?$') {
            throw "release_tag must look like v0.2.28."
          }

          "ref=$ref" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

          Write-Host "Checkout ref: $ref"
          Write-Host "Release tag: $tag"

      - name: Configure git
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "Sanheiii@users.noreply.github.com"
          git config --global user.name "Sanheiii"

      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.ref }}
          submodules: true
          lfs: true
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Inline ok requirements
        shell: pwsh
        run: |
          python -m ok.update.inline_ok_requirements --tag ${{ steps.meta.outputs.tag }}

      - name: Install fixed pnpm
        shell: pwsh
        run: |
          npm install -g pnpm@9.15.9
          pnpm --version

      - name: Build with PyAppify Action
        id: build-app
        uses: ok-oldking/pyappify-action@master
        env:
          CI: 'false'
        with:
          version: 'v1.0.42'
          use_release: ${{ inputs.use_release }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ steps.meta.outputs.tag }}
          path: pyappify_dist/*

      - name: Create or update GitHub Release
        if: ${{ inputs.upload_release }}
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ steps.meta.outputs.ref }}
          files: pyappify_dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
