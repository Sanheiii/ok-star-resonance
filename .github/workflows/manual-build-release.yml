name: Manual Build Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release, e.g. v0.2.28'
        required: true
        type: string
      use_release:
        description: 'Base release API URL used by pyappify-action'
        required: false
        default: 'https://api.github.com/repos/Sanheiii/ok-star-resonance/releases/tags/v0.1.14'
        type: string

permissions: write-all

jobs:
  build:
    name: Build selected tag
    runs-on: windows-2022

    env:
      PYTHONIOENCODING: 'UTF-8'
      PYTHONLEGACYWINDOWSSTDIO: 'utf-8'
      CI: 'false'

    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - name: Resolve build metadata
        id: meta
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"

          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "Input 'tag' is required."
          }

          if ($tag -notmatch '^v?\d+\.\d+\.\d+(-[A-Za-z0-9._-]+)?$') {
            throw "tag must look like v0.2.28."
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Build tag: $tag"

      - name: Configure git
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "Sanheiii@users.noreply.github.com"
          git config --global user.name "Sanheiii"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: true
          fetch-depth: 0

      - name: Verify tag exists
        shell: pwsh
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          git fetch --force --tags origin

          $tagRef = git ls-remote --tags origin "refs/tags/$tag"
          if ([string]::IsNullOrWhiteSpace($tagRef)) {
            throw "Remote tag '$tag' does not exist. This workflow will not create new tags."
          }

          git checkout "refs/tags/$tag"
          git status --short --branch

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Inline ok requirements
        shell: pwsh
        run: |
          python -m ok.update.inline_ok_requirements --tag ${{ steps.meta.outputs.tag }}

      - name: Install fixed pnpm
        shell: pwsh
        run: |
          npm install -g pnpm@9.15.9
          pnpm --version

      - name: Build with PyAppify Action
        id: build-app
        uses: ok-oldking/pyappify-action@master
        env:
          CI: 'false'
        with:
          version: 'v1.0.42'
          use_release: ${{ inputs.use_release }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ steps.meta.outputs.tag }}
          path: pyappify_dist/*

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ steps.meta.outputs.tag }}
          files: pyappify_dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
          overwrite_files: true
